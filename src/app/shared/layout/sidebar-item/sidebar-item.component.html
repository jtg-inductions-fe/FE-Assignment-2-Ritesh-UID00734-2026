<ng-container *ngIf="!hasChildren; else expandableItem">
  <a
    mat-list-item
    class="sidebar-item"
    [routerLink]="item.route"
    routerLinkActive="sidebar-item--active"
    (click)="onItemClick()">
    <div class="sidebar-item__content">
      <div class="sidebar-item__left">
        <mat-icon class="sidebar-item__icon">
          {{ item.icon }}
        </mat-icon>

        <span class="sidebar-item__label">
          {{ item.label }}
        </span>
      </div>

      <span *ngIf="item.badge" class="badge badge--sm badge--info">
        {{ item.badge }}
      </span>
    </div>
  </a>
</ng-container>

<ng-template #expandableItem>
  <button mat-list-item type="button" class="sidebar-item" (click)="toggle()">
    <div class="sidebar-item__content">
      <div class="sidebar-item__left">
        <mat-icon class="sidebar-item__icon">
          {{ item.icon }}
        </mat-icon>

        <span class="sidebar-item__label">
          {{ item.label }}
        </span>
      </div>

      <div class="sidebar-item__right">
        <span *ngIf="item.badge" class="badge">
          {{ item.badge }}
        </span>

        <mat-icon class="sidebar-item__expand">
          {{ expanded ? 'expand_more' : 'chevron_right' }}
        </mat-icon>
      </div>
    </div>
  </button>

  <div *ngIf="expanded" class="sidebar-item__children">
    <app-sidebar-item *ngFor="let child of item.children" [item]="child">
    </app-sidebar-item>
  </div>
</ng-template>
