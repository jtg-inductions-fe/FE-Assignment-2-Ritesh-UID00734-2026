<header class="header">
  <mat-toolbar class="header__toolbar">
    <section class="header__left">
      <button
        *ngIf="(isMobile$ | async) && (currentUser$ | async)"
        mat-icon-button
        type="button"
        (click)="toggleSidebar()"
        aria-label="Toggle sidebar">
        <mat-icon>menu</mat-icon>
      </button>

      <a
        class="header__logo"
        routerLink="/dashboard"
        aria-label="Restaurant Management">
        <img
          class="header__logo-image"
          src="assets/images/app-logo.svg"
          alt="Restaurant Management Logo" />
      </a>
    </section>

    <ng-container *ngIf="currentUser$ | async as currentUser">
      <button
        mat-icon-button
        [matMenuTriggerFor]="userMenu"
        aria-label="Open user menu">
        <img
          class="header__avatar"
          [src]="currentUser.avatar"
          [alt]="currentUser.name" />
      </button>

      <mat-menu #userMenu="matMenu">
        <section class="header__user">
          <p class="header__user-name">
            {{ currentUser.name }}
          </p>

          <p class="header__user-email">
            {{ currentUser.email }}
          </p>
        </section>

        <mat-divider></mat-divider>

        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon>

          <span>Logout</span>
        </button>
      </mat-menu>
    </ng-container>
  </mat-toolbar>
</header>
