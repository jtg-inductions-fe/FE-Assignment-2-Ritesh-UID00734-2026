<mat-form-field class="ui-input" [appearance]="appearance">
  <mat-label>
    {{ label }}
  </mat-label>

  <input
    matInput
    [type]="inputType"
    [placeholder]="placeholder"
    [formControl]="control" />

  <button
    *ngIf="type === 'password' && showPasswordToggle"
    mat-icon-button
    matSuffix
    type="button"
    (click)="togglePassword()">
    <mat-icon>
      {{ hidePassword ? 'visibility_off' : 'visibility' }}
    </mat-icon>
  </button>

  <mat-error *ngIf="control.invalid && (control.dirty || control.touched)">
    {{ errorMessage }}
  </mat-error>
</mat-form-field>
